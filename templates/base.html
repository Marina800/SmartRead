<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}SmartRead{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">📚 SmartRead</a>
        <a class="nav-link text-white" href="/books/">📚 Книги</a>
        <form method="get" action="/" class="d-flex" style="max-width: 300px">
          <input
            type="text"
            name="q"
            class="form-control form-control-sm me-2"
            placeholder="Поиск статей..."
          />
          <button class="btn btn-outline-light btn-sm" type="submit">
            Найти
          </button>
        </form>
      </div>
    </nav>
    <main class="container my-4">{% block content %}{% endblock %}</main>
    <footer class="bg-dark text-white text-center py-3 mt-5">
      © 2026 SmartRead — книжный блог
    </footer>
  </body>
</html>
